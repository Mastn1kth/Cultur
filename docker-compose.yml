services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: culturematch
      POSTGRES_PASSWORD: culturematch
      POSTGRES_DB: culturematch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/src/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    command: npm run dev -w apps/api

volumes:
  pgdata:
